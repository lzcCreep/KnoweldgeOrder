services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - zhixu-postgres:/var/lib/postgresql/data

volumes:
  zhixu-postgres:
